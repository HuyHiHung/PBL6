# Supabase CLI owns the Docker stack; do not start a second compose Postgres.
project_id = "pbl6"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[db.pooler]
enabled = false
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "10MiB"
[storage.s3_protocol]
enabled = false
[storage.vector]
enabled = false
[realtime]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:5174/auth/callback", "sprout://auth/callback", "sprout://auth/callback?mode=recovery"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
[auth.external.google]
# Enable only after configuring the two environment variables and Google callback.
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
